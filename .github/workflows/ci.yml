name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall pocketmanager

      - name: Lint (ruff)
        run: ruff check pocketmanager tests

      - name: Run tests
        run: python -m pytest tests -v --tb=short

  install-script:
    # Cheap gate: syntax-check the installer (no Python needed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install script syntax check
        run: bash -n install.sh

  dashboard-only:
    # Fast lane that also runs on non-Linux contributors: dashboard tests
    # need no PocketBase binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Dashboard tests
        run: python -m pytest tests/integration/test_dashboard.py -v --tb=short
